<!DOCTYPE html>
<html lang="en" dir="ltr" data-startbar="light" data-bs-theme="light">


<head>


    <meta charset="utf-8" />
    <title>Smartank | Email Confirmed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta content="Email Confirmation Page for Smartank" name="description" />
    <meta content="Smartank" name="author" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link rel="shortcut icon" href="assets/images/logo-sm.png">


    <link href="assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/app.min.css" rel="stylesheet" type="text/css" />

</head>


<body>
    <div class="container-xxl">
        <div class="row vh-100 d-flex justify-content-center">
            <div class="col-12 align-self-center">
                <div class="card-body">
                    <div class="row">
                        <div class="col-lg-4 mx-auto">
                            <div class="card">
                                <div class="card-body p-0 bg-white auth-header-box rounded-top">
                                    <div class="text-center p-3">
                                        <a href="index.html" class="logo logo-admin">
                                            <img src="assets/images/logo-sm.png" height="50" alt="logo"
                                                class="auth-logo">
                                        </a>
                                        <h4 class="mt-3 mb-1 fw-semibold text-black fs-18">Email Confirmed!</h4>
                                        <p class="text-muted fw-medium mb-0">Your email address has been successfully
                                            confirmed.</p>
                                    </div>
                                </div>
                                <div class="card-body pt-0">
                                    <div class="text-center my-4">
                                        <div class="text-success display-4 mb-3">
                                            <i class="far fa-check-circle"></i>
                                        </div>
                                        <p class="text-muted mb-4">You can now proceed to log in to your Smartank
                                            account.</p>
                                        <div class="d-grid mt-3">
                                            <a href="auth-login.html" class="btn btn-primary">Go to Login <i
                                                    class="fas fa-sign-in-alt ms-1"></i></a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
